[package]
name = "oxide"
version = "0.1.0"
edition = "2021"
description = "A modern Rust CLI for generating, developing, and managing backend projects"
license = "MIT"
repository = "https://github.com/nuswa/oxide"
keywords = ["cli", "backend", "generator", "rust", "axum"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "oxide"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"

serde = { version = "1", features = ["derive"] }
toml = "0.8"

anyhow = "1"
thiserror = "2"

include_dir = "0.7"

which = "7"

chrono = "0.4"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
